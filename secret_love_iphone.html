ho":"them","text":"부상이 걱정됐어요. 처방받은 대로 관리하세요."},{"who":"me","text":"그것 말고 보고 싶진 않았어?"},{"who":"them","text":"그 질문에는 답하지 않겠습니다. 오늘 저는 담당 의료진이었어요."}],"note":""},{"date":"2026-12-29 21:50","title":"결정을 존중해 주세요","chapter":"12월 · 재회를 바라며","messages":[{"who":"me","text":"태오야, 정말 다시 만날 가능성 없어? ㅠㅠ"},{"who":"them","text":"미안해요. 결정은 달라지지 않았어요."},{"who":"them","text":"당신이 건강하길 바랍니다. 하지만 이 문제로 더 연락하지 말아주세요."}],"note":""},{"date":"2027-01-01 00:13","title":"새해 첫날, 술에 취해 보낸 문자","chapter":"12월 · 취중 연락","messages":[{"who":"me","text":"태오야아ㅏㅠㅠㅠ"},{"who":"me","text":"태오가 해주던 밥 너무 머꼬시퍼ㅠㅠ"},{"who":"me","text":"나 지금도 아파ㅏ 마음이 너무아파"},{"who":"me","text":"한번만 돌아와주면 안댈까ㅏ"},{"who":"them","text":"취한 것 같네요. 물을 마시고 더는 마시지 마세요."},{"who":"them","text":"당신이 힘든 건 안타깝지만 연인으로 돌아가진 않겠습니다."}],"note":""},{"date":"2027-01-22 07:20","title":"양상추를 더 먹었어","chapter":"1~4월 · 보내지 못한 일기","messages":[{"who":"me","text":"태오야, 아침 먹었어. 네가 말한 거 기억하고 있어."},{"who":"me","text":"나 좀 나아지면 다시 만나줄 수 있을까?"},{"who":"system","text":"읽음 · 답장 없음"}],"note":""},{"date":"2027-02-14 17:05","title":"의무실 의자에서","chapter":"1~4월 · 보내지 못한 일기","messages":[{"who":"system","text":"협회 의무실 치료 후"},{"who":"me","text":"태오야, 아까 얼굴 보고 울 뻔했어. 열도 나고 속도 안 좋은데 네가 안아줬으면 좋겠어."},{"who":"them","text":"오늘 확인한 증상은 휴식과 치료가 필요해요."},{"who":"them","text":"저를 다시 만나기 위해 아픈 걸 참거나 증명하지는 말아요."},{"who":"me","text":"나 이제 조금도 사랑 안 해?"},{"who":"them","text":"지금 그 질문에는 답하지 않을게요."}],"note":""},{"date":"2027-03-11 00:23","title":"양상추 세 장","chapter":"1~4월 · 보내지 못한 일기","messages":[{"who":"me","text":"태오야. 오늘 샌드위치에 양상추 세 장 들어 있더라."},{"who":"me","text":"예전에는 이런 말 하면 잔소리했을 텐데 ㅎㅎ"},{"who":"me","text":"보고 싶어. 미안해."},{"who":"system","text":"읽음 · 답장 없음"}],"note":""},{"date":"2027-04-19 21:04","title":"평범한 날의 사랑","chapter":"1~4월 · 보내지 못한 일기","messages":[{"who":"me","text":"태오야. 사랑은 평범한 날에도 같이 있는 거라고 했지."},{"who":"me","text":"나는 그 평범한 날을 너무 쉽게 생각했나 봐."},{"who":"me","text":"이제야 알아. 미안해."},{"who":"system","text":"읽음 · 답장 없음"}],"note":""},{"date":"2027-04-28 16:43","title":"응급의료팀 호출","chapter":"4월 · 수술","messages":[{"who":"system","text":"윤태오가 의료센터에서 환자를 직접 확인하고 치유 능력으로 응급 안정화를 지원"},{"who":"them","text":"……제발. 이번에는 의사로서 할 수 있는 걸 다 할게요. 무사히 돌아와요."}],"note":""},{"date":"2027-04-28 23:38","title":"수술이 끝났어요","chapter":"72시간 · 부재중 알림","messages":[{"who":"call","text":"부재중 전화 1통"},{"who":"them","text":"수술은 끝났어요. 아직 의식이 돌아오지 않아 걱정되는 상태지만 의료진이 지켜보고 있어요."},{"who":"them","text":"이 문자를 읽을 때쯤 당신이 조금이라도 나아졌기를 바랍니다."},{"who":"them","text":"……많이 놀랐어요. 이렇게 무서웠던 적이 있나 싶네요."}],"note":""},{"date":"2027-04-29 23:06","title":"의사로서, 그리고 사랑했던 사람으로서","chapter":"72시간 · 부재중 알림","messages":[{"who":"them","text":"아까 당신 손을 잡고 있었어요. 치료에 필요한 확인이었지만 조금 더 잡고 싶었어요."},{"who":"them","text":"지난 몇 달 동안 진료실에서 만날 때마다 보고 싶다는 말을 참았습니다."},{"who":"voice","text":"0:55|……자기. 오랜만에 그렇게 불러보네요. 오늘 상태 확인하고 돌아왔어요. 의사로서 해야 할 일은 했는데, 연인으로서 해주고 싶은 일은 아직 많아요. 함께 저녁 먹고, 잠들면 이불 덮어주고. 그 평범한 일을 다시 하고 싶어요. 깨어나면 제 마음이 어떻게 달라졌는지 직접 이야기할게요."}],"note":""},{"date":"2027-04-30 19:28","title":"다시 만들어 드릴 도시락","chapter":"72시간 · 부재중 알림","messages":[{"who":"them","text":"좋은 아침이에요. 아침은 꼭 먹어야 한다고 잔소리하던 게 습관이었는데요."},{"who":"them","text":"오늘은 당신이 좋아하던 계란말이를 떠올렸어요."},{"who":"them","text":"회복하면 제가 도시락 만들어드릴게요. 의사로서가 아니라 함께 식사하고 싶은 사람으로요."}],"note":""},{"date":"2027-05-01 14:31","title":"사랑합니다","chapter":"72시간 · 부재중 알림","messages":[{"who":"call","text":"부재중 전화 2통"},{"who":"them","text":"솔직히 말씀드릴게요. 저는 아직 당신을 사랑합니다."},{"who":"them","text":"다시 연애할 수 있을지 진지하게 이야기해 보고 싶어요. 충분히 회복한 뒤에요."},{"who":"them","text":"오늘도 상태를 확인하고 왔어요. 살아서 제게 다시 웃어주세요."},{"who":"them","text":"……사랑해요. ❤️"}],"note":""}],"calls":3,"voices":1},{"id":"eun","name":"백은호","description":"부지휘관 · S급 히어로","color":"#7187A3","start":"2024-09-30","pet":"형","kind":"hero","icon":"🖤","episodes":[{"date":"2024-09-30 21:05","title":"식탁의 두 번째 의자","chapter":"처음의 우리","messages":[{"who":"them","text":"오늘 저녁은 먹었나."},{"who":"me","text":"형, 아직. 왜?"},{"who":"them","text":"밥을 많이 했다. 네 몫도 있다."},{"who":"me","text":"형은 맨날 이렇게 챙겨줘 ㅎㅎ"},{"who":"them","text":"……네가 오면 집이 덜 조용하니까."},{"who":"m ❤️"}],"note":""}],"calls":3,"voices":1},{"id":"kain","name":"류카인","description":"베스퍼 · S급 빌런","color":"#A784BE","start":"2025-08-30","pet":"내 사랑","kind":"villain","icon":"🦋","episodes":[{"date":"2025-08-30 22:31","title":"달빛 정원에서","chapter":"처음의 우리","messages":[{"who":"them","text":"내 사랑, 오늘 밤 정원에 초대해도 되겠니?"},{"who":"me","text":"나한테만 보여주는 거야? ♡"},{"who":"them","text":"물론. 이 세상의 달빛을 모두 모아도 네 미소에는 부족하겠구나."},{"who":"me","text":"카인아, 나 너 좋아해."},{"who":"them","text":"……아아. 내게 현실을 사랑할 이유를 주는구나."},{"who":"them","text":"네가 허락한다면 평생 너를 사랑하고 싶단다. 🦋"}],"note":"이전 연애 기간과 성격을 바탕으로 재구성한 첫 대화"},{"date":"2026-10-30 23:32","title":"내일 우리 집에 라면 먹으러 올래? ♡","chapter":"10월의 비밀","messages":[{"who":"me","text":"내일 우리집에 라면 먹으러 올래~? ❤️"},{"who":"them","text":"기꺼이, 내 사랑."},{"who":"them","text":"라면 한 그릇과 꽃 한 송이를 가져가마."},{"who":"them","text":"네 곁에서 보내는 평범한 저녁이 기대되는구나."}],"note":"10명에게 독립된 개인 채팅으로 전송. 방문 시각은 아직 미정이었음."},{"date":"2026-10-31 00:03","title":"연애사부터 프러포즈까지","chapter":"심야 연애 테스트","messages":[{"who":"me","text":"자기, 나 만나기 전에 애인 몇 명 만났어? 남자였어, 여자였어? ♡"},{"who":"them","text":"없어. 너는 내 첫사랑이란다. 내가 만든 환상보다 내 손을 더 오래 바라본 사람."},{"who":"me","text":"그렇구나 ㅎㅎ 그럼 자기 방식으로 사랑한다고 해줘. 프러포즈도 좋아 ❤️"},{"who":"them","text":"내게 평생 네 곁에서 계절을 세어볼 영광을 주겠니? 나와 결혼해 주렴, 내 사랑."},{"who":"me","text":"으앙 설레... 그럼 우리 결혼하면 아이 몇 명? 딸? 아들? 아니면 단둘이? 💋"},{"who":"them","text":"딸 하나를 상상했단다. 하지만 네가 아이를 원치 않아도 네 곁에서 늙어가는 것으로 행복해."}],"note":""},{"date":"2026-10-31 00:29","title":"질투 · 유혹 · 서운함 네 가지 질문","chapter":"심야 연애 테스트","messages":[{"who":"me","text":"자기야, 만약 내가 애인이 열 명이나 있는 바람둥이라면? ㅎㅎ ♡"},{"who":"them","text":"너를 소유할 권리는 없지만 거짓말 속에 웃는 연인이 되고 싶지는 않단다."},{"who":"me","text":"농담이야! 그럼 평생 자기만 볼 수 있게 유혹해줘 ❤️"},{"who":"them","text":"별들을 띄워도 나는 별이 아니라 너를 볼 거야. 내 능력으로 만들 수 없는 아름다움이니까."},{"who":"me","text":"으앙 설레... 내가 자기 인생에 없었다면 뭐가 달라졌을까?"},{"who":"them","text":"관객 없는 정원에서 환상만 만들었겠지. 너는 현실을 사랑하게 해준 사람이야."},{"who":"me","text":"나랑 사귀면서 서운했던 점 있어? 오늘만큼은 솔직하게 말해줘."},{"who":"them","text":"네가 시계를 보지 않고 내 정원에 머무는 날이 오면 좋겠구나."}],"note":""},{"date":"2026-11-03 21:17","title":"시나몬빵","chapter":"11월 · 평범한 사랑","messages":[{"who":"them","text":"내 사랑, 오늘 달이 참 밝구나."},{"who":"me","text":"카인이는 맨날 달 얘기해 ㅋㅋ"},{"who":"them","text":"그렇다면 오늘은 다른 이야기를 해볼까?"},{"who":"me","text":"뭔데? ♡"},{"who":"them","text":"집 앞 빵집에서 시나몬빵을 샀단다."},{"who":"me","text":"ㅋㅋㅋㅋ 카인이 일상 너무 귀여워"}],"note":""},{"date":"2026-11-08 15:09","title":"작고 노란 꽃","chapter":"11월 · 평범한 사랑","messages":[{"who":"me","text":"카인아 이 꽃 이름 알아? 📸"},{"who":"them","text":"아, 작고 노란 꽃이구나. 금계국 같지만 사진만으로 단정하긴 어렵겠어."},{"who":"me","text":"카인이 꽃 박사 ♡"},{"who":"them","text":"네가 보여주는 꽃이라면 무엇이든 배우고 싶단다."}],"note":""},{"date":"2026-11-14 23:48","title":"일상에 머무는 사랑","chapter":"11월 · 평범한 사랑","messages":[{"who":"them","text":"오늘 책에서 마음에 드는 문장을 읽었어."},{"who":"me","text":"어떤 문장?"},{"who":"them","text":"사랑은 특별한 날보다 반복되는 하루에 머문다는 말이었지."},{"who":"me","text":"우리 같은데? ♡"},{"who":"them","text":"그래. 그래서 이 문장을 보자마자 네게 보내고 싶었단다."}],"note":""},{"date":"2026-11-20 18:02","title":"앞머리를 조금","chapter":"11월 · 평범한 사랑","messages":[{"who":"me","text":"카인아, 나 머리 잘랐어"},{"who":"them","text":"얼마나 잘랐니?"},{"who":"me","text":"앞머리 조금 ㅎㅎ"},{"who":"them","text":"그 작은 변화도 직접 보고 싶구나."},{"who":"me","text":"사진 보내줄까? ♡"},{"who":"them","text":"물론이지. 내 하루에 작은 봄이 오겠구나."}],"note":""},{"date":"2026-11-26 22:40","title":"진짜 장미","chapter":"11월 · 평범한 사랑","messages":[{"who":"them","text":"정원에 진짜 장미 한 송이가 피었단다."},{"who":"me","text":"환각 말고 진짜?"},{"who":"them","text":"그래. 이번에는 직접 물을 주며 키웠지."},{"who":"me","text":"우리 카인이 대단해 ♡"},{"who":"them","text":"네가 좋아할 것 같아서 시작한 일이었어."},{"who":"them","text":"이제는 꽃이 자라는 시간을 기다리는 것도 좋아졌구나."}],"note":""},{"date":"2026-11-30 23:20","title":"12월의 정원","chapter":"11월 · 평범한 사랑","messages":[{"who":"me","text":"카인아, 11월 마지막 밤이야 ♡"},{"who":"them","text":"그래, 내 사랑. 이번 달에는 보여주고 싶은 꽃이 많이 피었단다."},{"who":"me","text":"12월에도 같이 보자"},{"who":"them","text":"기꺼이. 네가 있는 겨울도 분명 아름다울 테니까. 🦋❤️"}],"note":""},{"date":"2026-12-01 00:18","title":"공유 폴더, 처음 드러난 진실","chapter":"12월 · 발각","messages":[{"who":"them","text":"내 사랑. 우리가 달빛 정원에서 나눈 대화가 왜 다른 연인들의 기록과 함께 있니?"},{"who":"me","text":"카인아, 오해야. 장난이야."},{"who":"them","text":"나는 환상을 만드는 사람이라 진실의 가치를 알아. 아픈 진실이라도 말해주렴."},{"who":"me","text":"미안해. 열 명이랑 동시에 사귀었어. 그래도 카인이도 진심으로 사랑했어."},{"who":"them","text":"아아…… 내 사랑. 내게 스스로 선택할 기회를 주지 않았구나."},{"who":"them","text":"너와 나눈 시간까지 부정하고 싶지는 않단다."},{"who":"them","text":"하지만 우리는 여기서 연인이라는 이름을 내려놓자꾸나."}],"note":""},{"date":"2026-12-04 22:06","title":"달이 예쁜 밤","chapter":"12월 · 재회를 바라며","messages":[{"who":"me","text":"카인아. 오늘도 달이 예뻐. 같이 보고 싶었어."},{"who":"system","text":"읽음 · 답장 없음"}],"note":""},{"date":"2026-12-12 23:35","title":"꽃을 보러 가도 될까","chapter":"12월 · 재회를 바라며","messages":[{"who":"me","text":"카인아. 우리 같이 심은 꽃 보러 다시 가도 될까?"},{"who":"them","text":"……꽃은 잘 자라고 있단다."},{"who":"them","text":"하지만 지금은 함께 오지 않았으면 해. 이별을 받아들여 줬으면 한단다."}],"note":""},{"date":"2026-12-29 23:06","title":"정원의 다음 계절","chapter":"12월 · 재회를 바라며","messages":[{"who":"me","text":"카인아 내년에도 같이 꽃을 볼 수 없을까?"},{"who":"them","text":"네가 그렇게 말하니 마음이 흔들리는구나."},{"who":"them","text":"그러나 네가 그리워한다는 이유만으로 다시 시작되지는 않아. 거리를 존중해 주렴."}],"note":""},{"date":"2027-01-01 00:13","title":"새해 첫날, 술에 취해 보낸 문자","chapter":"12월 · 취중 연락","messages":[{"who":"me","text":"카이나아ㅏㅠㅠㅠ 나의 왕자니임"},{"who":"me","text":"푸른나비 다시 보고시퍼ㅓ"},{"who":"me","text":"나 아직도 카인이 첫사랑이고시퍼"},{"who":"them","text":"……술에 취한 것 같구나. 오늘은 더 이야기하지 않는 게 좋겠어."},{"who":"them","text":"다시 돌아가겠다는 말로 지금 너를 위로하는 건 진실하지 못하겠지."},{"who":"them","text":"부디 너 자신을 돌보렴."}],"note":""},{"date":"2027-01-18 20:25","title":"달이 예뻐","chapter":"1~4월 · 보내지 못한 일기","messages":[{"who":"me","text":"카인아, 달이 예뻐. 같이 보고 싶어."},{"who":"me","text":"나 그때 너무 행복했어. 정말 미안해."},{"who":"system","text":"읽음 · 답장 없음"}],"note":""},{"date":"2027-02-23 23:52","title":"장미를 사주고 싶었어","chapter":"1~4월 · 보내지 못한 일기","messages":[{"who":"me","text":"카인아, 꽃집 앞에서 한참 서 있었어. 장미를 사주고 싶었어."},{"who":"me","text":"네 첫사랑이라는 말 아직도 못 잊었어."},{"who":"them","text":"……네 마음은 읽었단다."},{"who":"them","text":"하지만 지금 내게 필요한 건 꽃이 아니라 거리야. 그 시간을 허락해 주렴."}],"note":""},{"date":"2027-03-19 22:38","title":"정원에서 쉬고 싶어","chapter":"1~4월 · 보내지 못한 일기","messages":[{"who":"me","text":"내 사랑이었던 카인아. 오늘 감기 때문에 아팠어."},{"who":"me","text":"네 정원에서 잠깐 쉬고 싶지만 네가 원치 않으면 찾아가지 않을게."},{"who":"me","text":"잘 자. 사랑해."},{"who":"system","text":"읽음 · 답장 없음"}],"note":""},{"date":"2027-04-25 00:13","title":"진짜 꽃 한 송이","chapter":"1~4월 · 보내지 못한 일기","messages":[{"who":"me","text":"카인아. 오늘 진짜 꽃을 한 송이 샀어. 창가에 뒀는데 잘 자라면 좋겠다."},{"who":"me","text":"돌아오라는 말 대신 네가 내 삶에 있어 고마웠다고 남기고 싶었어."},{"who":"system","text":"읽음 · 답장 없음"}],"note":""},{"date":"2027-04-28 18:12","title":"뉴스 속보","chapter":"4월 · 수술","messages":[{"who":"system","text":"공개 뉴스 · S급 히어로가 중상을 입고 긴급 수술 중"},{"who":"them","text":"아아…… 내 사랑. 부디 살아남아 주렴."}],"note":""},{"date":"2027-04-28 21:59","title":"어두운 꿈에서 길 잃지 말아주렴","chapter":"72시간 · 부재중 알림","messages":[{"who":"call","text":"부재중 전화 4통"},{"who":"them","text":"내 사랑. 네가 지금 어느 꿈속을 헤매는지 모르겠구나."},{"who":"them","text":"그곳이 너무 어둡지 않기를 바란단다. 나는 여기서 기다리고 있어."}],"note":""},{"date":"2027-04-29 23:43","title":"환상이 아니라 현실의 너","chapter":"72시간 · 부재중 알림","messages":[{"who":"them","text":"밤새 아름다운 환상을 만들어도 마음이 편해지지 않는구나."},{"who":"them","text":"네가 좋아하던 푸른 꽃이 정원에 피었어. 환상이 아니라 내가 키운 꽃이란다."},{"who":"voice","text":"1:13|내 사랑…… 네 편지를 읽을 때마다 마음이 흔들렸단다. 다시 믿는 일이 무서워 답장을 피했지. 하지만 너를 사랑하지 않은 적은 없어. 돌아온다면 이번에는 내가 먼저 찾아갈게. 우리 다시 사랑할 수 있도록 내가 다시 구애하마. 부디 살아 돌아와 주렴."}],"note":""},{"date":"2027-04-30 21:39","title":"아름다운 말뿐 아니라","chapter":"72시간 · 부재중 알림","messages":[{"who":"call","text":"부재중 전화 5통"},{"who":"them","text":"아침 햇빛이 정원에 내려앉았어. 네가 없는 아침은 참 조용하구나."},{"who":"them","text":"우리 관계가 다시 시작된다면 아름다운 말만 나누고 싶지 않아."},{"who":"them","text":"네 두려움과 내가 아팠던 일도 함께 이야기하고 싶어."}],"note":""},{"date":"2027-05-01 16:23","title":"나의 유일한 봄","chapter":"72시간 · 부재중 알림","messages":[{"who":"call","text":"부재중 전화 3통"},{"who":"them","text":"사흘이라는 시간이 이렇게 길 수 있구나. 네가 깨어나면 보여줄 꽃을 한 송이 골랐단다."},{"who":"them","text":"네가 돌아오면 내가 먼저 사랑한다고 고백하마. 다시 연인이 되어달라고."},{"who":"them","text":"이번에는 도망치지 않으려 해. 부디 돌아와 주렴. 나의 유일한 봄. 🦋❤️"}] ":"2026-11-30 23:34","title":"가장 좋았던 날","chapter":"11월 · 평범한 사랑","messages":[{"who":"me","text":"기현아, 11월도 끝이야."},{"who":"them","text":"그러네."},{"who":"me","text":"이번 달 제일 좋았던 일은? ♡"},{"who":"them","text":"네가 연습실에 와서 아무 말 없이 같이 차 마신 날."},{"who":"me","text":"음악도 안 들었는데?"},{"who":"them","text":"그래서 더 좋았어. 잘 자. 사랑해. ❤️"}],"note":""},{"date":"2026-12-01 00:18","title":"공유 폴더, 처음 드러난 진실","chapter":"12월 · 발각","messages":[{"who":"them","text":"사진첩 봤어. 다른 사람과 나눈 연애 기록이 많더라."},{"who":"me","text":"기현아, 그거 장난이야 ㅠㅠ"},{"who":"them","text":"……나도 장난이면 좋겠어. 그런데 날짜가 너무 구체적이야."},{"who":"me","text":"미안해. 사실 열 명이랑 사귀었어. 기현이도 진심이었어."},{"who":"them","text":"……생각할 시간이 필요해."},{"who":"them","text":"네가 나를 사랑하지 않았다고 단정하고 싶진 않아. 하지만 내가 믿은 관계가 뭐였는지 모르겠어."},{"who":"them","text":"나는 지금 다시 시작할 수 없어. 당분간 연락하지 않을게."}],"note":""},{"date":"2026-12-02 23:55","title":"함께 듣던 곡","chapter":"12월 · 재회를 바라며","messages":[{"who":"me","text":"기현아, 오늘 네가 들려주던 곡 들었어. 너무 보고 싶어."},{"who":"system","text":"읽음 · 답장 없음"}],"note":""},{"date":"2026-12-17 22:18","title":"음악 때문만은 아니야","chapter":"12월 · 재회를 바라며","messages":[{"who":"me","text":"기현아, 나는 네 음악이 좋아서만 사랑한 게 아니야. 그냥 기현이가 좋았어."},{"who":"system","text":"읽음 · 답장 없음"}],"note":""},{"date":"2026-12-30 23:49","title":"올해의 마지막 밤","chapter":"12월 · 재회를 바라며","messages":[{"who":"me","text":"기현아. 우리 이렇게 끝나는 거 싫어. 내가 기다리면 돌아와 줄 수 있을까?"},{"who":"system","text":"읽음 · 답장 없음"}],"note":""},{"date":"2027-01-01 00:13","title":"새해 첫날, 술에 취해 보낸 문자","chapter":"12월 · 취중 연락","messages":[{"who":"me","text":"ㄱ혀너아아 기현ㅇ아ㅏㅠㅠ"},{"who":"me","text":"내가잘못해서유ㅠㅠㅠ 너무보고싶어ㅠㅠㅠㅠ"},{"who":"me","text":"사랑해ㅠㅠㅠ 하ㅏㄴ한번만 용서해두라제발..."},{"who":"them","text":"……메시지 읽었어. 술 마셨구나."},{"who":"them","text":"나는 네가 걱정돼. 하지만 오늘 밤 위로하려고 다시 사귀겠다고 말할 순 없어."},{"who":"them","text":"일단 쉬어. 답장은 여기까지 할게."}],"note":""},{"date":"2027-01-16 01:07","title":"피아노 소리","chapter":"1~4월 · 보내지 못한 일기","messages":[{"who":"me","text":"기현아. 오늘 피아노 소리 들으면서 잠들었어."},{"who":"me","text":"네가 연주한 곡은 아니어서 더 슬펐어. 사랑해. 미안해."},{"who":"system","text":"읽음 · 답장 없음"}],"note":""},{"date":"2027-02-22 23:48","title":"아픈 날의 일기","chapter":"1~4월 · 보내지 못한 일기","messages":[{"who":"me","text":"기현아. 오늘 몸이 많이 아팠어. 밥도 조금 남겼어."},{"who":"me","text":"네가 있었으면 물 가져다주고 손 잡아줬겠지."},{"who":"me","text":"나 이제 싫어? 나만 계속 사랑해?"},{"who":"me","text":"……미안해. 답장 안 해도 돼. 너무 보고 싶었어."},{"who":"system","text":"읽음 · 답장 없음"}],"note":""},{"date":"2027-03-18 02:03","title":"오늘의 일기","chapter":"1~4월 · 보내지 못한 일기","messages":[{"who":"me","text":"기현아 오늘 출동 두 번 했고 점심으로 빵 먹었어."},{"who":"me","text":"소금빵 가게 앞에 서서 네 생각하다 한참 못 움직였어."},{"who":"me","text":"네가 없으면 안 될 것 같아. 근데 그 마음으로 널 괴롭히면 안 되겠지."},{"who":"system","text":"전송됨 · 답장 없음"}],"note":""},{"date":"2027-04-27 23:56","title":"내일은 덜 울게","chapter":"1~4월 · 보내지 못한 일기","messages":[{"who":"me","text":"기현아. 내일은 조금 덜 울어보려고."},{"who":"me","text":"네가 행복했던 순간으로 나를 기억해 줬으면 좋겠어."},{"who":"me","text":"우리 같이 듣던 빗소리 생각나. 보고 싶어."},{"who":"system","text":"읽음 · 답장 없음"}],"note":""},{"date":"2027-04-28 18:12","title":"뉴스 속보","chapter":"4월 · 수술","messages":[{"who":"system","text":"공개 뉴스 · S급 히어로가 중상을 입고 긴급 수술 중"},{"who":"them","text":"……어제 메시지 보냈었는데. 제발 살아서 돌아와."}],"note":""},{"date":"2027-04-28 23:09","title":"마지막 일기를 읽었어","chapter":"72시간 · 부재중 알림","messages":[{"who":"call","text":"부재중 전화 28통"},{"who":"them","text":"나야, 기현이. 소식 들었어. 제발 살아서 돌아와."},{"who":"them","text":"네가 내일은 덜 울어보겠다고 했잖아. 그때 답장할걸 그랬어."}],"note":""},{"date":"2027-04-29 23:58","title":"너무 보고 싶어서","chapter":"72시간 · 부재중 알림","messages":[{"who":"them","text":"나 피아노 앞인데 아무것도 연주하지 못하겠어."},{"who":"them","text":"네가 없으면 안 될 것 같다는 말을 읽을 때마다 두려웠어. 그런데 나도 네가 없으면 너무 무서워."},{"who":"voice","text":"1:18|……자기, 나야. 네 목소리 들으면 알겠지. 내가 그동안 답장하지 않은 건 네가 싫어서가 아니야. 너무 보고 싶어서였어. 답장하면 다시 만나고 싶어질까 봐 피했어. 이제 그 시간이 후회돼. 다시 사랑해 볼 용기를 내고 싶어. 돌아오면 내가 먼저 만나자고 할게."},{"who":"them","text":"네가 좋아하던 곡을 두 소절 연주하다 멈췄어. 자꾸 눈물이 나더라."}],"note":""},{"date":"2027-04-30 20:47","title":"완성하지 못한 곡들","chapter":"72시간 · 부재중 알림","messages":[{"who":"call","text":"부재중 전화 7통"},{"who":"them","text":"오늘 소금빵 샀어. 네가 있었으면 너무 짜다고 웃었을 텐 const PEOPLE=ARCHIVE.people;
const EVENTS=ARCHIVE.events;
const $=sel=>document.querySelector(sel);
const state={page:'lock',thread:null,group:'all',search:'',monthYear:2026,month:10,day:'2026-11-08',phoneTab:'calls',photo:null,bookmarks:new Set(),seen:new Set(),note:'',voiceExpand:null};
try{state.bookmarks=new Set(JSON.parse(localStorage.getItem('sl_bookmarks')||'[]'))}catch(e){}
function save(){try{localStorage.setItem('sl_bookmarks',JSON.stringify([...state.bookmarks]))}catch(e){}}
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const pmap=Object.fromEntries(PEOPLE.map(p=>[p.id,p]));
const todayDate='2027-05-01';
function daysTogether(start){const f=s=>Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10));return Math.round((f(todayDate)-f(start))/86400000)+1}
function timeLabel(s){return s.slice(11,16)}
function dateLong(s){const a=s.slice(0,10).split('-');return +a[0]+'년 '+(+a[1])+'월 '+(+a[2])+'일'}
function monthOf(s){return s.slice(0,7)}
function renderAvatar(p,extra=''){return `<span class="avatar ${extra}" style="background:linear-gradient(145deg,${p.color},#31354f)">${esc(p.name.slice(-1))}</span>`}
function icon(name){const icons={messages:'●',phone:'☎',calendar:'',photos:'',notes:'▤',settings:'⚙',clock:'◷',archive:'♥'};return icons[name]||'✦'}
function enter(page){state.page=page;render()}
function setStatus(light){$('#status').classList.toggle('light',light);$('#homebar').classList.toggle('white',light)}
function render(){const el=$('#screen');el.className='screen '+(state.page==='lock'?'wallpaper':state.page==='home'?'home':'app-screen');setStatus(state.page==='lock'||state.page==='home');$('#clock').textContent=state.page==='lock'?'':'17:42'; if(state.page==='lock')renderLock(el);else if(state.page==='home')renderHome(el);else if(state.page==='messages')renderMessages(el);else if(state.page==='chat')renderChat(el);else if(state.page==='calendar')renderCalendar(el);else if(state.page==='phone')renderPhone(el);else if(state.page==='photos')renderPhotos(el);else if(state.page==='notes')renderNotes(el);else if(state.page==='clock')renderClock(el);else if(state.page==='settings')renderSettings(el)}
function renderLock(el){const first=PEOPLE.slice(0,4);el.innerHTML=`<div class="lock-ui"><div class="lock-symbol">🔒</div><div class="lock-date">5월 1일 토요일</div><div class="lock-time">17:42</div><div class="lock-widgets">${first.map(p=>`<div class="lock-widget"><div class="mini-ico">${p.icon}</div><div class="num">D+${daysTogether(p.start)}</div><div class="who">${p.name}</div></div>`).join('')}</div><div class="lock-notif-head"><span>고정된 기념일 알림 · 10개</span><button id="lock-more">모두 보기</button></div><div class="lock-notifs" id="lock-list">${PEOPLE.map(p=>`<button class="lock-notif" data-unlock="${p.id}">${renderAvatar(p)}<div class="lock-notif-main"><div class="lock-notif-title">${p.icon} ${p.name} <span>D+${daysTogether(p.start)}</span></div><div class="lock-notif-sub">처음 연인이 된 날 · ${esc(dateLong(p.start))}</div></div></button>`).join('')}</div><div class="unlock-area"><button class="flash-cam" id="flash">⌁</button><button class="unlock-button" id="unlock"><i class="chevron-up"></i>위로 쓸어 잠금 해제</button><button class="flash-cam" id="camera">◉</button></div></div>`;$('#unlock').onclick=()=>enter('home');$('#lock-more').onclick=()=>{$('#lock-list').scrollTo({top:$('#lock-list').scrollHeight,behavior:'smooth'})};el.querySelectorAll('[data-unlock]').forEach(b=>b.onclick=()=>{state.thread=b.dataset.unlock;state.page='chat';render()});$('#flash').onclick=()=>enter('home');$('#camera').onclick=()=>enter('photos');let startY=null;el.addEventListener('touchstart',e=>{startY=e.touches?.[0]?.clientY},{passive:true,once:true});el.addEventListener('touchend',e=>{if(startY!==null&&startY-e.changedTouches[0].clientY>65)enter('home')},{once:true});}
function appButton(label,type,emoji,action,badge=0){let inner=type==='calendar'?'<small>토요일</small><strong>1</strong>':type==='photos'?'<div class="petal"></div>':`<span>${emoji}</span>`;return `<button class="app-item" data-go="${action}" aria-label="${label}"><span class="app-icon ${type}">${inner}</span>${badge?`<span class="app-badge">${badge>99?'99+':badge}</span>`:''}<span>${label}</span></button>`}
function renderHome(el){el.innerHTML=`<div class="home-inner"><div class="home-date">2027년 5월 1일 토요일</div><div class="home-head">다시 눈을 뜬 날. ♡</div><button class="home-feature" data-go="messages"><div class="home-feature-kicker">SECRET LOVE · 부재중 72시간</div><div class="home-feature-main">10개의 기다림, 333통의 전화</div><div class="home-feature-text">열 명의 메시지와 음성 녹취가 도착했어요.<br>오래된 대화도 그대로 보관되어 있습니다.</div></button><div class="apps-grid">${appButton('메시지','messages','●','messages',10)}${appButton('캘린더','calendar','','calendar')}${appButton('사진','photos','','photos')}${appButton('메모','notes','▤','notes')}${appButton('전화','phone-icon','☎','phone',99)}${appButton('시계','clock','◷','clock')}${appButton('설정','settings','⚙','settings')}${appButton('아카이브','archive','♡','notes')}</div><div class="home-dots"><i></i><i></i><i></i></div><div class="dock">${appButton('전화','phone-icon','☎','phone')}${appButton('메시지','messages','●','messages')}${appButton('캘린더','calendar','','calendar')}${appButton('사진','photos','','photos')}</div></div>`;el.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>enter(b.dataset.go))}
function appTabs(active='messages'){const tabs=[['messages','▣','메시지'],['calendar','▦','캘린더'],['phone','☎','전화'],['photos','▧','사진']];return `<div class="app-tabbar">${tabs.map(([id,g,l])=>`<button class="tabbarbtn ${active===id?'active':''}" data-tab="${id}"><span class="glyph">${g}</span>${l}</button>`).join('')}</div>`}

function lastEntry(p){for(let e=p.episodes.length-1;e>=0;e--)for(let m=p.episodes[e].messages.length-1;m>=0;m--){const x=p.episodes[e].messages[m];if(x.who==='them'||x.who==='me')return x.text}return ''}
function renderMessages(el){const matched=PEOPLE.filter(p=>(state.group==='all'||p.kind===state.group)&&(!state.search||p.name.includes(state.search)||p.description.includes(state.search)||p.episodes.some(e=>e.title.includes(state.search)||e.messages.some(m=>m.text.includes(state.search)))));el.innerHTML=`<div class="app-content"><div class="navrow"><button class="navbtn" data-home>‹ 홈</button><button class="navbtn" data-notes>기록</button></div><div class="screen-title">메시지</div><div class="search-wrap"><input class="ios-search" id="msg-search" type="search" placeholder="⌕  이름 또는 대화 내용 검색" value="${esc(state.search)}" autocomplete="off"></div><div class="chipbar"><button class="chip ${state.group==='all'?'active':''}" data-group="all">전체 · 10</button><button class="chip ${state.group==='hero'?'active':''}" data-group="hero">히어로 · 5</button><button class="chip ${state.group==='villain'?'active':''}" data-group="villain">빌런 · 5</button></div><div class="ios-list" id="messages-list">${matched.length?matched.map(p=>`<button class="person-row" data-person="${p.id}">${renderAvatar(p)}<div class="person-meta"><div class="person-meta-top"><span class="person-name">${p.icon} ${p.name}</span><span class="person-time">5월 1일</span></div><div class="person-last">${esc(lastEntry(p)).slice(0,110)}</div></div><span class="unread-dot"></span></button>`).join(''):'<div class="empty-results">검색과 일치하는 대화가 없어요.</div>'}<div class="list-foot">10개의 비밀 채팅 · 모든 기록은 이 파일 안에만 보관됩니다</div></div>${appTabs('messages')}</div>`;el.querySelector('[data-home]').onclick=()=>enter('home');el.querySelector('[data-notes]').onclick=()=>enter('notes');el.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{state.group=b.dataset.group;render()});el.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>openChat(b.dataset.person));let search=$('#msg-search');search.oninput=()=>{state.search=search.value;const position=search.selectionStart;renderMessages(el);const input=$('#msg-search');input.focus();input.setSelectionRange(position,position)};bindTabs(el)}
function openChat(id,chapter='latest'){state.thread=id;state.page='chat';render();if(chapter!=='latest')requestAnimationFrame(()=>jumpChapter(chapter))}
const JUMPS=[['start','첫 대화','처음의 우리'],['oct','10월','10월의 비밀'],['tests','질문','심야 연애 테스트'],['nov','11월','11월 · 평범한 사랑'],['dec','12월','12월 · 발각'],['diary','1~4월','1~4월 · 보내지 못한 일기'],['last','72시간','72시간 · 부재중 알림']];
function jumpChapter(key){const p=pmap[state.thread],target=JUMPS.find(x=>x[0]===key),episode=key==='last'?p.episodes.find(e=>e.chapter==='72시간 · 부재중 알림'):p.episodes.find(e=>e.chapter===target?.[2]);if(!episode)return;const i=p.episodes.indexOf(episode);const element=document.getElementById('e-'+i);if(element){const sc=$('#thread-scroll');sc.scrollTop+=element.getBoundingClientRect().top-sc.getBoundingClientRect().top-6}document.querySelectorAll('.jump').forEach(b=>b.classList.toggle('active',b.dataset.jump===key))}
function renderVoice(body){const parts=body.split('|');const duration=parts.length>1?parts.shift():'0:45';const transcript=parts.join('|')||body;const sizes=[6,12,20,9,15,23,8,14,19,10,7,22,17,10,19,13,6,18,11,8,22,13];return `<div class="voice-card"><div class="voice-header"><span>◉</span>음성메시지 <span class="voice-duration">${esc(duration)}</span></div><div class="wave">${sizes.map(n=>`<i style="--h:${n}px"></i>`).join('')}</div><div class="voice-transcript">${esc(transcript)}</div></div>`}
function episodeBody(p){return p.episodes.map((e,idx)=>`<section class="episode" id="e-${idx}"><div class="episode-divider"><span>${dateLong(e.date)} · ${timeLabel(e.date)}</span><b>${esc(e.title)}</b></div>${e.messages.map((m,i)=>{if(m.who==='system')return `<div class="sysline">${esc(m.text)}</div>`;if(m.who==='call')return `<div class="call-chip"><span>☎</span><span>${esc(m.text)}</span></div>`;const who=m.who==='me'?'from-me':'from-them';return `<div class="msg-row ${who}">${m.who==='me'?'':renderAvatar(p,'tiny-avatar')}<div class="msg-bubble">${m.who==='voice'?renderVoice(m.text):esc(m.text)}</div></div>`}).join('')}</section>`).join('')}
function renderChat(el){const p=pmap[state.thread]||PEOPLE[0];el.innerHTML=`<div class="app-content thread"><div class="thread-head"><div class="thread-top"><button class="back-chat" id="thread-back"><span class="arrow">‹</span><small>메시지</small></button><div class="thread-contact">${renderAvatar(p)}<div class="name">${p.icon} ${p.name} ⌄</div><div class="detail">${esc(p.description)}</div></div><button class="thread-actions" id="thread-phone" title="부재중 통화 보기">☎</button></div><div class="jump-strip">${JUMPS.map(([k,label])=>`<button class="jump ${k==='last'?'active':''}" data-jump="${k}">${label}</button>`).join('')}</div></div><div class="thread-messages" id="thread-scroll">${episodeBody(p)}</div><div class="thread-bottom"><button class="composer-plus" id="composer-plus">+</button><button class="composer" id="composer" aria-label="아카이브 읽기 전용"><span>읽기 전용 기록</span><span class="muted">2027. 5. 1.</span></button><span class="composer-mic">◉</span></div></div>`;$('#thread-back').onclick=()=>enter('messages');$('#thread-phone').onclick=()=>{state.phoneTab='calls';enter('phone')};el.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>jumpChapter(b.dataset.jump));$('#composer').onclick=$('#composer-plus').onclick=()=>notice('이 파일은 대화 기록 보관용이에요. 새 메시지는 전송되지 않습니다.');requestAnimationFrame(()=>{const sc=$('#thread-scroll');if(sc)sc.scrollTop=sc.scrollHeight})}

function ymKey(y,m){return `${y}-${String(m+1).padStart(2,'0')}`}
function setMonth(change){state.month+=change;if(state.month>11){state.month=0;state.monthYear++}if(state.month<0){state.month=11;state.monthYear--}const k=ymKey(state.monthYear,state.month);const first=EVENTS.find(e=>e.date.startsWith(k));state.day=first?.date||k+'-01';render()}
function renderCalendar(el){const y=state.monthYear,m=state.month,firstDay=(new Date(Date.UTC(y,m,1)).getUTCDay()+6)%7,last=new Date(Date.UTC(y,m+1,0)).getUTCDate(),days=Math.ceil((firstDay+last)/7)*7;const grid=Array.from({length:days},(_,i)=>{const d=i-firstDay+1;const inMonth=d>=1&&d<=last;const date=ymKey(y,m)+'-'+String(d).padStart(2,'0');const es=inMonth?EVENTS.filter(e=>e.date===date):[];return `<button class="day-cell ${inMonth?'':'outside'} ${state.day===date?'selected':''} ${date===todayDate?'today':''}" data-date="${date}" ${!inMonth?'disabled':''}><span class="day-num">${inMonth?d:''}</span><span class="dots">${es.slice(0,3).map(e=>`<i style="background:${pmap[e.person]?.color||'#aaa'}"></i>`).join('')}</span></button>`}).join('');const dayEvents=EVENTS.filter(e=>e.date===state.day);el.innerHTML=`<div class="app-content calendar-view"><div class="navrow"><button class="navbtn" id="cal-back">‹ 홈</button><button class="navbtn" id="cal-today">오늘</button></div><div class="calendar-header"><span class="calendar-month">${y}년 ${m+1}월</span><span style="display:flex;gap:7px"><button class="month-move" id="prev-month">‹</button><button class="month-move" id="next-month">›</button></span></div><div class="weeknames">${['월','화','수','목','금','토','일'].map(x=>`<span>${x}</span>`).join('')}</div><div class="month-grid">${grid}</div><div class="event-date-title">${dateLong(state.day)} · ${dayEvents.length}개의 일정</div><div class="calendar-events">${dayEvents.length?dayEvents.map(e=>`<button class="event-card" data-eventperson="${e.person}"><span class="event-rail" style="background:${pmap[e.person]?.color||'#aaa'}"></span><div class="event-body"><div class="event-name">${pmap[e.person]?.icon||'♡'} ${esc(e.title)}</div><div class="event-desc">${esc(e.description)}</div><div class="event-kind">${esc(pmap[e.person]?.name||'')} · ${e.kind==='date'?'데이트':e.kind==='anniversary'?'기념일':'특별한 날'}</div></div><span style="color:#b8b8bf">›</span></button>`).join(''):'<div class="calend function extractVoices(){const all=[];for(const p of PEOPLE)for(const e of p.episodes)for(const m of e.messages)if(m.who==='voice'){const parts=m.text.split('|');all.push({p,e,duration:parts.shift(),text:parts.join('|')})}return all.sort((a,b)=>b.e.date.localeCompare(a.e.date))}

function renderPhotos(el){const selected=PEOPLE.filter(p=>!state.photo||p.id===state.photo);el.innerHTML=`<div class="app-content"><div class="navrow"><button class="navbtn" id="photo-back">‹ 홈</button><button class="navbtn" id="photo-reset">모두 보기</button></div><div class="screen-title">추억 사진첩</div><div style="font-size:12px;color:#85858b;padding:0 20px 5px">인물별 스크랩북 · 이미지 대신 추억 장면을 표시</div><div class="scrollarea" style="flex:1"><div class="album-grid">${selected.map(p=>{const d=EVENTS.filter(x=>x.person===p.id&&x.kind==='date');return `<button class="album-card" style="--album-bg:linear-gradient(145deg,${p.color},#34334e)" data-album="${p.id}"><span class="emoji">${p.icon}</span><b>${p.name}</b><small>${d.length}개의 데이트 기록<br>${d.length?esc(d[d.length-1].title):'함께한 기억'}</small></button>`}).join('')}</div>${state.photo?`<div style="padding:4px 18px 25px">${EVENTS.filter(e=>e.person===state.photo).map(e=>`<div class="event-card" style="width:100%"><span class="event-rail" style="background:${pmap[e.person].color}"></span><div class="event-body"><div class="event-name">${esc(e.title)}</div><div class="event-desc">${dateLong(e.date)} · ${esc(e.description)}</div></div></div>`).join('')}</div>`:''}</div>${appTabs('photos')}</div>`;$('#photo-back').onclick=()=>enter('home');$('#photo-reset').onclick=()=>{state.photo=null;render()};el.querySelectorAll('[data-album]').forEach(b=>b.onclick=()=>{state.photo=state.photo===b.dataset.album?null:b.dataset.album;render()});bindTabs(el)}
function renderNotes(el){const chapters=[['처음의 우리','첫 고백 · 10명, 각각의 시작','start'],['10월의 비밀','옥상, 라면 초대, 처음 사귄 날','oct'],['심야 연애 테스트','연애사, 프러포즈, 질투, 유혹, 서운함','tests'],['11월 · 평범한 사랑','라면, 푸딩, 꽃, 게임, 소금빵','nov'],['12월 · 발각','열 개의 관계가 드러난 밤','dec'],['1~4월 · 보내지 못한 일기','사과와 무응답, 네 달의 기다림','diary'],['72시간 · 부재중 알림','대수술 후 사흘간 쌓인 메시지','last']];const total=PEOPLE.reduce((s,p)=>s+p.episodes.reduce((a,e)=>a+e.messages.length,0),0);el.innerHTML=`<div class="app-content"><div class="navrow"><button class="navbtn" id="notes-back">‹ 홈</button><button class="navbtn" id="notes-messages">메시지 보기</button></div><div class="screen-title">아카이브 메모</div><div class="scrollarea" style="flex:1"><div class="note-card" style="background:#fff4cf"><h3>♡ SECRET LOVE · 기록 인덱스</h3><p>10명의 연인 · ${PEOPLE.reduce((s,p)=>s+p.episodes.length,0)}개 대화 장면 · ${total.toLocaleString('ko-KR')}개 말풍선/알림<br>2024년 9월 ~ 2027년 5월 1일</p></div>${chapters.map(([name,sub,key])=>`<button class="note-card" data-chapter="${key}"><h3>${name}　›</h3><p>${sub}<br>탭하면 강시헌의 해당 시점부터 펼쳐집니다.</p></button>`).join('')}<div class="blurb">이 파일은 앞선 역할극의 설정을 바탕으로 재구성한 기록입니다. 지정되지 않았던 과거의 첫 채팅과 일부 데이트 날짜는 장면을 채우기 위한 창작 보강이며, 저장된 고정 시점은 2027년 5월 1일 오후 5시 42분입니다.</div></div>${appTabs('messages')}</div>`;$('#notes-back').onclick=()=>enter('home');$('#notes-messages').onclick=()=>enter('messages');el.querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>openChat('sih',b.dataset.chapter));bindTabs(el)}
function renderClock(el){el.innerHTML=`<div class="app-content"><div class="navrow"><button class="navbtn" id="clock-back">‹ 홈</button></div><div class="screen-title">시계</div><div class="scrollarea" style="flex:1"><div style="text-align:center;padding:31px 22px 25px"><div style="font-size:13px;color:#9b9ba5;margin-bottom:10px">이야기 속 시간 · 2027년 5월 1일</div><div style="font-size:65px;font-weight:280;letter-spacing:-.07em">17:42</div><div style="font-size:15px;color:#777">사흘 만에 깨어난 오후 ♡</div></div><div class="setting-section"><div class="setting-row"><span class="left">◷　2027.04.28 16:16</span><span class="value">제9구역 중상</span></div><div class="setting-row"><span class="left">◷　2027.04.28 17:06</span><span class="value">긴급 수술 시작</span></div><div class="setting-row"><span class="left">◷　2027.04.28 21:38</span><span class="value">수술 종료</span></div><div class="setting-row"><span class="left">◷　2027.05.01 17:42</span><span class="value">의식 회복</span></div></div><div class="blurb">실제 시간에 맞춰 변하는 시계가 아니라 역할극의 현재 시점에 고정된 기록 시계입니다.</div></div>${appTabs('messages')}</div>`;$('#clock-back').onclick=()=>enter('home');bindTabs(el)}
function renderSettings(el){el.innerHTML=`<div class="app-content"><div class="navrow"><button class="navbtn" id="settings-back">‹ 홈</button></div><div class="screen-title">설정</div><div class="scrollarea" style="flex:1"><div class="setting-section"><div class="setting-row"><span class="left">♡　SECRET LOVE</span><span class="value">iPhone 아카이브</span></div><div class="setting-row"><span class="left">◷　기준 시점</span><span class="value">2027.05.01 17:42</span></div><div class="setting-row"><span class="left">▣　보관한 채팅방</span><span class="value">10</span></div><div class="setting-row"><span class="left">☎　부재중 통화</span><span class="value">333통</span></div><div class="setting-row"><span class="left">◎　음성 녹취</span><span class="value">13개</span></div></div><div class="setting-section"><div class="setting-row"><span class="left">🔒　오프라인 단일 파일</span><span class="value">연결 불필요</span></div><div class="setting-row"><span class="left">✧　화면 형식</span><span class="value">iOS 스타일 · 430 × 932</span></div></div><div class="blurb">이 페이지는 iOS 디자인을 참고한 인터랙티브한 창작 아카이브로, 실제 iOS 운영체제나 아이폰 기능을 실행하지 않습니다. 잠금화면 D+ 수치는 처음 교제를 시작한 날 기준의 기록이며 현재 교제 상태를 의미하지 않습니다.</div><button class="note-card" id="back-lock"><h3>잠금화면으로 돌아가기　⌁</h3><p>D-Day 고정 알림 열 개를 다시 볼 수 있습니다.</p></button></div>${appTabs('messages')}</div>`;$('#settings-back').onclick=()=>enter('home');$('#back-lock').onclick=()=>enter('lock');bindTabs(el)}
$('#homebar').onclick=()=>{if(state.page==='lock')enter('home');else if(state.page==='home')enter('lock');else enter('home')};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.page==='chat')enter('messages');else if(state.page!=='lock'&&state.page!=='home')enter('home');else if(state.page==='home')enter('lock')}});
render();
</script>
</body></html>
